<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Тренажёр НОК по лифтам</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px; margin: 0;
        }
        .container {
            background: white; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 750px; width: 100%; padding: 30px;
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #1a365d; text-align: center; }
        .subtitle { text-align: center; color: #4a5568; margin-bottom: 15px; font-size: 14px; }
        .timer { text-align: center; font-weight: bold; font-size: 18px; color: #c53030;
            background: #fff5f5; border-radius: 8px; padding: 8px 16px; margin-bottom: 20px;
            display: flex; justify-content: center; align-items: center; gap: 6px; }
        .timer.warning { animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
        .progress-bar { height: 8px; background: #e2e8f0; border-radius: 4px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(135deg, #3182ce, #2b6cb0); border-radius: 4px; transition: width 0.3s; }
        .question-counter { font-weight: bold; color: #2b6cb0; margin-bottom: 15px; font-size: 16px; }
        .question-text { font-size: 18px; font-weight: 600; color: #2d3748; margin-bottom: 25px; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .option { padding: 15px 20px; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: all 0.2s; font-size: 16px; color: #2d3748; background: white; }
        .option:hover { border-color: #90cdf4; background: #ebf8ff; }
        .option.selected { border-color: #3182ce; background: #ebf8ff; }
        .option.correct { border-color: #38a169; background: #f0fff4; color: #22543d; font-weight: 600; }
        .option.incorrect { border-color: #e53e3e; background: #fff5f5; color: #742a2a; }
        .option:disabled { opacity: 0.7; pointer-events: none; }
        .button-group { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        button { padding: 12px 28px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; background: #e2e8f0; color: #4a5568; transition: all 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #3182ce; color: white; } .btn-primary:hover:not(:disabled) { background: #2b6cb0; }
        .btn-success { background: #38a169; color: white; } .btn-success:hover:not(:disabled) { background: #2f855a; }
        .result-screen { display: none; }
        .score { font-size: 48px; font-weight: bold; color: #2b6cb0; margin: 20px 0; text-align: center; }
        .topic-stats { margin-top: 25px; text-align: left; }
        .topic-stats h3 { margin-bottom: 12px; color: #2d3748; }
        .topic-table { width: 100%; border-collapse: collapse; }
        .topic-table th, .topic-table td { border: 1px solid #e2e8f0; padding: 10px; text-align: center; }
        .topic-table th { background: #edf2f7; font-weight: 600; color: #2d3748; }
        .weak-topic { background-color: #fff5f5; font-weight: bold; color: #c53030; }
        .restart-btn { background: #2d3748; color: white; margin-top: 30px; display: block; margin-left: auto; margin-right: auto; }
        .feedback { margin-top: 10px; font-style: italic; color: #4a5568; min-height: 24px; text-align: center; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div id="quiz-screen">
        <h1>Тренажёр НОК по лифтам</h1>
        <div class="subtitle">Специалист по эксплуатации лифтового оборудования (200 вопросов)</div>
        <div class="timer" id="timer-display">⏱ Осталось: 30:00</div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="question-counter" id="question-counter"></div>
        <div class="question-text" id="question-text"></div>
        <div class="options" id="options-container"></div>
        <div class="feedback" id="feedback"></div>
        <div class="button-group">
            <button id="prev-btn" disabled>← Назад</button>
            <button id="next-btn" class="btn-primary" disabled>Далее →</button>
        </div>
    </div>
    <div id="result-screen" class="result-screen">
        <h1>Тест завершён!</h1>
        <p style="text-align:center;">Правильных ответов:</p>
        <div class="score" id="score-display"></div>
        <p id="result-message" style="text-align:center; margin-bottom:20px;"></p>
        <div class="topic-stats">
            <h3>Результаты по темам (ошибки подсвечены красным)</h3>
            <table class="topic-table" id="topic-table">
                <thead><tr><th>Тема</th><th>Верно</th><th>Всего</th><th>Качество</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <button class="restart-btn" id="restart-btn">Пройти заново</button>
    </div>
</div>

<script>
(function() {
    // Ровно 200 вопросов, без страховочного цикла
    const questions = [
        { topic: "Технический регламент", question: "На какие лифты распространяется действие ТР ТС 011/2011?", options: ["Только на пассажирские", "На все лифты, предназначенные для использования на территории стран Таможенного союза", "На лифты грузоподъёмностью более 1000 кг", "Только на новые лифты после 2020 года"], correct: 1 },
        { topic: "Технический регламент", question: "Кто обязан оформить декларацию соответствия лифта требованиям ТР ТС 011/2011?", options: ["Ростехнадзор", "Специализированная лифтовая организация", "Владелец лифта или уполномоченное им лицо", "Монтажная организация"], correct: 2 },
        { topic: "Технический регламент", question: "На какую минимальную нагрузку должен быть рассчитан пол приямка лифта?", options: ["1000 Н/м²", "5000 Н/м²", "На вес противовеса", "В регламенте не указано"], correct: 1 },
        { topic: "Технический регламент", question: "Какое минимальное количество тяговых элементов должно быть в лифте?", options: ["Один", "Два", "Три", "Четыре"], correct: 1 },
        { topic: "Технический регламент", question: "Как часто должно проводиться периодическое техническое освидетельствование лифта?", options: ["Ежемесячно", "Не реже одного раза в 12 месяцев", "Раз в 5 лет", "После каждого ремонта"], correct: 1 },
        { topic: "Организация эксплуатации", question: "Какая группа по электробезопасности требуется специалисту, организующему эксплуатацию лифтов?", options: ["I", "II", "III", "Не ниже IV"], correct: 3 },
        { topic: "Организация эксплуатации", question: "Что должен предпринять владелец лифта при возникновении угрозы причинения вреда жизни и здоровью граждан?", options: ["Продолжить эксплуатацию до плановой проверки", "Приостановить использование лифта и принять меры по устранению угрозы", "Сообщить в ЖЭК в течение 10 дней", "Вызвать производителя оборудования"], correct: 1 },
        { topic: "Организация эксплуатации", question: "Какой документ подтверждает квалификацию специалиста, ответственного за лифтовое хозяйство?", options: ["Диплом технического вуза", "Удостоверение о повышении квалификации", "Свидетельство о независимой оценке квалификации (НОК)", "Сертификат производителя лифтов"], correct: 2 },
        { topic: "Организация эксплуатации", question: "В течение какого срока владелец лифта обязан направить в Ростехнадзор извещение об аварии?", options: ["Немедленно", "В течение 24 часов", "В течение 3 суток", "До начала работы комиссии"], correct: 1 },
        { topic: "Организация эксплуатации", question: "Как часто владелец должен проводить проверки работоспособности лифта (ежесменные)?", options: ["Ежедневно перед началом смены", "Еженедельно", "Раз в месяц", "Только при жалобах"], correct: 0 },
        { topic: "Организация эксплуатации", question: "Кто может выполнять техническое обслуживание и ремонт лифтов?", options: ["Любой сотрудник УК", "Специализированная организация, имеющая квалифицированный персонал", "Сам владелец", "Представитель завода-изготовителя"], correct: 1 },
        { topic: "Техническое обслуживание и ремонт", question: "Что входит в обязанности специалиста, ответственного за организацию эксплуатации лифтов?", options: ["Ежедневная замена ламп", "Контроль соблюдения графиков ТО и ремонта", "Личный ремонт электродвигателя", "Продажа запчастей"], correct: 1 },
        { topic: "Техническое обслуживание и ремонт", question: "Допускается ли использовать лифт с истекшим сроком службы без дополнительной оценки?", options: ["Да, если он работает", "Нет, требуется экспертиза промышленной безопасности", "Допускается после одобрения жильцов", "Да, если проведен текущий ремонт"], correct: 1 },
        { topic: "Аварии и инциденты", question: "Что должно быть обеспечено в кабине лифта на случай аварийной остановки?", options: ["Кнопка вызова диспетчера и двусторонняя связь", "Огнетушитель", "Аптечка", "Запас воды"], correct: 0 },
        { topic: "Аварии и инциденты", question: "При каком условии разрешается возобновить эксплуатацию лифта после аварии?", options: ["После устной договорённости с инспектором", "После завершения расследования и устранения причин аварии с разрешением Ростехнадзора", "Сразу после ремонта", "Через 3 дня"], correct: 1 },
        { topic: "Технический регламент", question: "Какой документ устанавливает требования к безопасности лифтов в Таможенном союзе?", options: ["ГОСТ 22011-95", "ТР ТС 011/2011", "СНиП 21-01-97", "Федеральный закон №116-ФЗ"], correct: 1 },
        { topic: "Профессиональный стандарт", question: "Основная цель профессиональной деятельности специалиста по эксплуатации лифтов согласно профстандарту?", options: ["Максимизация прибыли", "Обеспечение безопасной эксплуатации лифтов", "Уменьшение затрат", "Расширение клиентской базы"], correct: 1 },
        { topic: "Электробезопасность", question: "Какое напряжение считается опасным для жизни при работе с лифтовым оборудованием?", options: ["12 В", "36 В", "Свыше 50 В переменного тока", "110 В"], correct: 2 },
        { topic: "Электробезопасность", question: "Какие мероприятия должны выполняться перед началом работ в шахте лифта?", options: ["Проветривание", "Отключение и блокировка главного рубильника, вывешивание плаката", "Протирка поручней", "Замена ламп"], correct: 1 },
        { topic: "Документирование", question: "Где должны храниться паспорта и руководства по эксплуатации лифтов?", options: ["В сейфе главного инженера", "У владельца лифта в составе эксплуатационной документации", "В Ростехнадзоре", "У жильцов"], correct: 1 },
        { topic: "Профессиональный стандарт", question: "Какая трудовая функция является основной для специалиста по организации эксплуатации лифтов?", options: ["Управление персоналом", "Организация безопасной эксплуатации лифтов", "Продажа оборудования", "Клининг"], correct: 1 },
        { topic: "Организация эксплуатации", question: "С какой периодичностью проводится полное техническое освидетельствование лифта?", options: ["Раз в 2 года", "Не реже одного раза в 12 месяцев", "Раз в 5 лет", "Только при замене канатов"], correct: 1 },
        { topic: "Технический регламент", question: "Сколько процентов от номинальной грузоподъёмности должен выдерживать канатоведущий шкив без проскальзывания?", options: ["100%", "125%", "150%", "200%"], correct: 1 },
        { topic: "Безопасность", question: "Обязательно ли наличие аварийного освещения в кабине лифта?", options: ["Нет", "Да, с автономным питанием не менее 1 часа", "Только в грузовых лифтах", "По желанию заказчика"], correct: 1 },
        { topic: "Эксплуатация", question: "Кто может проводить эвакуацию пассажиров из остановившегося лифта?", options: ["Любой сотрудник УК", "Только обученный персонал, имеющий допуск", "Пожарные", "Сами пассажиры"], correct: 1 },
        { topic: "Нормативная база", question: "Какой документ регламентирует правила организации безопасного использования и содержания лифтов в РФ?", options: ["Постановление Правительства №743", "ГОСТ Р 53780-2010", "Приказ Минтруда №203н", "Федеральный закон №123-ФЗ"], correct: 0 },

        { topic: "Техническое обслуживание", question: "В каком журнале фиксируются результаты ежесменного осмотра лифта?", options: ["Журнал учета работ", "Журнал технического обслуживания и ремонта", "Санитарный журнал", "Журнал инструктажа"], correct: 1 },
        { topic: "Аварийные ситуации", question: "Что необходимо сделать в первую очередь, если лифт остановился между этажами с пассажирами?", options: ["Отключить электричество", "Обеспечить связь с пассажирами и вызвать электромеханика", "Попытаться открыть двери", "Раскачивать кабину"], correct: 1 },
        { topic: "Документы", question: "Сколько лет хранится паспорт лифта после его демонтажа?", options: ["5 лет", "10 лет", "15 лет", "Бессрочно"], correct: 1 },
        { topic: "Требования к персоналу", question: "Что необходимо для назначения сотрудника ответственным за лифтовое хозяйство?", options: ["Стаж работы от 1 года", "Соответствие профстандарту и прохождение НОК", "Согласие профсоюза", "Наличие водительских прав"], correct: 1 },
        { topic: "Техническое освидетельствование", question: "Кто проводит полное техническое освидетельствование лифта?", options: ["Владелец", "Экспертная организация, аккредитованная в установленном порядке", "Сотрудник УК", "Представитель Ростехнадзора"], correct: 1 },
        { topic: "Пожарная безопасность", question: "Допускается ли установка лифтов в зданиях без автоматической системы пожарной сигнализации?", options: ["Да", "Зависит от назначения здания, но для пассажирских – как правило требуется", "Нет, никогда", "Только для грузовых"], correct: 1 },

        { topic: "Эксплуатация", question: "Можно ли перевозить в пассажирском лифте легковоспламеняющиеся жидкости?", options: ["Да, в небольших количествах", "Нет, запрещено", "Можно только в ночное время", "Можно с разрешения старшего по дому"], correct: 1 },
        { topic: "Обучение", question: "Как часто ответственный за лифтовое хозяйство должен подтверждать свою квалификацию?", options: ["Каждый год", "Раз в 3 года (срок действия свидетельства НОК)", "Раз в 5 лет", "Подтверждение не требуется"], correct: 1 },

        { topic: "Технический регламент", question: "Допускается ли использование лифта с треснувшим стеклом смотрового окна?", options: ["Да", "Нет, это нарушение требований безопасности", "Только если трещина не мешает обзору", "Допускается при скорости до 1 м/с"], correct: 1 },

        { topic: "Постановление №743", question: "Каким документом оформляется допуск лифта в эксплуатацию?", options: ["Актом технического освидетельствования", "Распоряжением Ростехнадзора", "Договором страхования", "Сертификатом качества"], correct: 0 },
        { topic: "Постановление №743", question: "Кто должен обеспечить проведение оценки соответствия лифта в течение назначенного срока службы?", options: ["Ростехнадзор", "Владелец", "Специализированная организация", "Производитель"], correct: 1 },

    const optionsContainer = document.getElementById('options-container');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const progressFill = document.getElementById('progress-fill');
    const questionCounter = document.getElementById('question-counter');
    const feedback = document.getElementById('feedback');
    const scoreDisplay = document.getElementById('score-display');
    const resultMessage = document.getElementById('result-message');
    const restartBtn = document.getElementById('restart-btn');
    const timerDisplay = document.getElementById('timer-display');
    const topicTableBody = document.querySelector('#topic-table tbody');

    function formatTime(seconds) {
        const min = Math.floor(seconds / 60);
        const sec = seconds % 60;
        return `${min}:${sec.toString().padStart(2, '0')}`;
    }
    function updateTimerDisplay() {
        timerDisplay.textContent = `⏱ Осталось: ${formatTime(timeLeft)}`;
        timerDisplay.classList.toggle('warning', timeLeft <= 300);
    }
    function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
    function startTimer() {
        stopTimer();
        timeLeft = 1800;
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) { stopTimer(); if (!quizFinished) { alert("Время вышло! Тест завершён."); finishQuiz(); } }
        }, 1000);
    }
    function shuffleArray(arr) { for (let i = arr.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
    function initQuiz() {
        stopTimer();
        shuffledQuestions = shuffleArray([...questions]);
        currentIndex = 0;
        userAnswers = new Array(questions.length).fill(null);
        answeredFlags = new Array(questions.length).fill(false);
        quizFinished = false;
        quizScreen.style.display = 'block';
        resultScreen.style.display = 'none';
        renderQuestion();
        updateProgress();
        startTimer();
    }
    function renderQuestion() {
        if (shuffledQuestions.length===0) return;
        const q = shuffledQuestions[currentIndex];
        questionText.textContent = q.question;
        questionCounter.textContent = `Вопрос ${currentIndex+1} из ${shuffledQuestions.length}`;
        feedback.textContent = '';
        optionsContainer.innerHTML = '';
        q.options.forEach((opt, idx) => {
            const optDiv = document.createElement('div');
            optDiv.className = 'option';
            optDiv.textContent = opt;
            optDiv.dataset.index = idx;
            const selectedAnswer = userAnswers[currentIndex];
            const isAnswered = answeredFlags[currentIndex];
            if (isAnswered) {
                optDiv.classList.add('disabled');
                if (idx === q.correct) optDiv.classList.add('correct');
                else if (idx === selectedAnswer && selectedAnswer !== q.correct) optDiv.classList.add('incorrect');
            } else {
                if (selectedAnswer !== null && idx === selectedAnswer) optDiv.classList.add('selected');
                optDiv.addEventListener('click', () => selectOption(idx));
            }
            optionsContainer.appendChild(optDiv);
        });
        prevBtn.disabled = (currentIndex === 0);
        nextBtn.disabled = (!answeredFlags[currentIndex]);
        if (currentIndex === shuffledQuestions.length-1) { nextBtn.textContent = 'Завершить'; nextBtn.classList.add('btn-success'); }
        else { nextBtn.textContent = 'Далее →'; nextBtn.classList.remove('btn-success'); }
        updateProgress();
    }
    function selectOption(optionIndex) {
        if (answeredFlags[currentIndex]) return;
        userAnswers[currentIndex] = optionIndex;
        document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
        document.querySelector(`.option[data-index="${optionIndex}"]`).classList.add('selected');
        nextBtn.disabled = false;
    }
    function checkCurrentAnswer() {
        if (answeredFlags[currentIndex]) return;
        const q = shuffledQuestions[currentIndex];
        const selected = userAnswers[currentIndex];
        const isCorrect = (selected === q.correct);
        answeredFlags[currentIndex] = true;
        feedback.textContent = isCorrect ? '✓ Верно!' : '✗ Неверно.';
        renderQuestion();
    }
    function nextQuestion() {
        if (!answeredFlags[currentIndex]) { checkCurrentAnswer(); return; }
        if (currentIndex === shuffledQuestions.length-1) { finishQuiz(); }
        else { currentIndex++; renderQuestion(); }
    }
    function prevQuestion() { if (currentIndex>0) { currentIndex--; renderQuestion(); } }
    function updateProgress() { progressFill.style.width = ((currentIndex+1)/shuffledQuestions.length*100)+'%'; }
    function finishQuiz() {
        if (quizFinished) return;
        quizFinished = true;
        stopTimer();
        quizScreen.style.display = 'none';
        resultScreen.style.display = 'block';
        let correctCount = 0;
        const topicStats = {};
        for (let i=0; i<shuffledQuestions.length; i++) {
            const q = shuffledQuestions[i];
            if (!topicStats[q.topic]) topicStats[q.topic] = {total:0, correct:0};
            topicStats[q.topic].total++;
            if (userAnswers[i] === q.correct) { correctCount++; topicStats[q.topic].correct++; }
        }
        scoreDisplay.textContent = `${correctCount} / ${shuffledQuestions.length}`;
        const percent = (correctCount/shuffledQuestions.length)*100;
        resultMessage.textContent = percent>=80 ? 'Отличный результат! Вы готовы к экзамену.' :
                                   percent>=60 ? 'Неплохо, стоит повторить отдельные темы.' : 'Пока недостаточно. Изучите материал глубже.';
        topicTableBody.innerHTML = '';
        for (const [topic, stats] of Object.entries(topicStats)) {
            const row = document.createElement('tr');
            const topicPercent = (stats.correct/stats.total)*100;
            if (topicPercent<70) row.classList.add('weak-topic');
            row.innerHTML = `<td>${topic}</td><td>${stats.correct}</td><td>${stats.total}</td><td>${Math.round(topicPercent)}%</td>`;
            topicTableBody.appendChild(row);
        }
    }
    nextBtn.addEventListener('click', nextQuestion);
    prevBtn.addEventListener('click', prevQuestion);
    restartBtn.addEventListener('click', initQuiz);
    initQuiz();
})();
</script>
</body>
</html>
